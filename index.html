<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Budget Tracker</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 flex flex-col items-center justify-center">

  <div class="max-w-xl w-full bg-slate-800 rounded-xl shadow-2xl p-8 border border-slate-700">
    <h1 class="text-3xl font-bold mb-2 text-indigo-400">AI Budget Tracker 🧾</h1>
    <p class="text-slate-400 mb-6 text-sm">Upload a receipt image or type an expense description to parse automatically using Gemini.</p>

    <form id="expenseForm" class="space-y-4">
      <!-- Text Description Input -->
      <div>
        <label class="block text-sm font-medium mb-1 text-slate-300">Expense Description</label>
        <input 
          type="text" 
          id="textPrompt" 
          placeholder="e.g., Dinner at Olive Garden for $45" 
          class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-200"
        />
      </div>

      <!-- File Upload Input -->
      <div>
        <label class="block text-sm font-medium mb-1 text-slate-300">Receipt Image (Optional)</label>
        <input 
          type="file" 
          id="receiptFile" 
          accept="image/*"
          class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer"
        />
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        id="submitBtn"
        class="w-full bg-indigo-600 hover:bg-indigo-500 font-semibold py-3 rounded-lg transition duration-200 flex items-center justify-center"
      >
        <span>Analyze Expense</span>
      </button>
    </form>

    <!-- Loading Spinner -->
    <div id="loading" class="hidden mt-6 text-center text-indigo-400 font-medium animate-pulse">
      ⏳ AI is analyzing your expense...
    </div>

    <!-- Results Display -->
    <div id="resultCard" class="hidden mt-6 p-5 bg-slate-900 border border-slate-700 rounded-lg">
      <div class="flex justify-between items-start mb-2">
        <h2 id="resItem" class="text-xl font-bold text-white">Item Name</h2>
        <span id="resPrice" class="text-2xl font-black text-emerald-400">$0.00</span>
      </div>
      <div class="mb-3">
        <span id="resCategory" class="inline-block px-3 py-1 text-xs font-semibold bg-indigo-900/50 text-indigo-300 border border-indigo-700 rounded-full">
          Category
        </span>
      </div>
      <p id="resNotes" class="text-sm text-slate-400 italic"></p>
    </div>
  </div>

  <!-- JavaScript Integration -->
  <script>
    const form = document.getElementById('expenseForm');
    const loading = document.getElementById('loading');
    const resultCard = document.getElementById('resultCard');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const textPrompt = document.getElementById('textPrompt').value;
      const fileInput = document.getElementById('receiptFile').files[0];

      if (!textPrompt && !fileInput) {
        alert('Please enter a description or select an image!');
        return;
      }

      // Build Multipart Form Data
      const formData = new FormData();
      if (textPrompt) formData.append('text_prompt', textPrompt);
      if (fileInput) formData.append('file', fileInput);

      // UI States
      loading.classList.remove('hidden');
      resultCard.classList.add('hidden');

      try {
        const response = await fetch('http://127.0.0.1:8000/api/analyze-expense', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.detail || 'Failed to process expense.');
        }

        const data = await response.json();

        // Render Results
        document.getElementById('resItem').textContent = data.item_name;
        document.getElementById('resPrice').textContent = `$${data.price.toFixed(2)}`;
        document.getElementById('resCategory').textContent = data.category;
        document.getElementById('resNotes').textContent = data.confidence_notes;

        resultCard.classList.remove('hidden');
      } catch (error) {
        alert(`Error: ${error.message}`);
      } finally {
        loading.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
